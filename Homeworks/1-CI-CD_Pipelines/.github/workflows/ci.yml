name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Homeworks/1-CI-CD_Pipelines

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check index.html
        run: test -f index.html

      - name: Say hello
        run: echo "Hello from GitHub Actions!"

      - name: Show current directory
        run: pwd

      - name: Show files
        run: ls -la

      - name: Success
        run: echo "Website validation is successful"
